name: Release Build
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KEYSTORE_PATH: /tmp/app-release.keystore
  BUILD_JSON_PATH: build.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: ${{ github.ref == 'refs/heads/main' && 'gradle' || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}

      - run: npm install && npm install -g cordova && npm run setup

      - name: Prepare keystore & version
        run: |
          KEYSTORE_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_PATH" -alias release \
            -keyalg RSA -keysize 2048 -validity 365 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=CI,OU=CI,O=CI,L=Unknown,ST=Unknown,C=US"
          jq -n --arg ks "$KEYSTORE_PATH" --arg pass "$KEYSTORE_PASS" \
            '{"android":{"release":{"keystore":$ks,"alias":"release","storePassword":$pass,"password":$pass,"gradleArgs":["--no-daemon","--parallel","--build-cache","--max-workers=4"]}}}' \
            > "$BUILD_JSON_PATH"
          [ -f config.xml ] || { echo "config.xml not found"; exit 1; }
          VER=$(grep -oP 'version="\K[0-9.]+' config.xml)
          UPDATED="$VER-nightly.$(git rev-parse --short HEAD)"
          sed -i "s/version=\"$VER\"/version=\"$UPDATED\"/" config.xml
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "APK_PATH=/tmp/acode-release-$UPDATED.apk" >> $GITHUB_ENV

      - name: Build
        run: |
          echo "false" > /tmp/fdroid.bool
          node utils/storage_manager.mjs y
          npm run build paid prod apk -- --archs=arm64 --buildConfig=$BUILD_JSON_PATH
          mv platforms/android/app/build/outputs/apk/release/app-release.apk "$APK_PATH"
          rm -f "$KEYSTORE_PATH" "$BUILD_JSON_PATH"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ env.GIT_COMMIT }}
          path: ${{ env.APK_PATH }}
